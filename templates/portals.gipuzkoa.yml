# LANOPS · portals.yml para Gipuzkoa
# Generado desde https://github.com/LanopsDMM/lanops/blob/main/data/empresas.csv (07-oct-2026, 24 empresas).
# Uso: cp templates/portals.gipuzkoa.yml portals.yml   (portals.yml es personal y no se sube: está en .gitignore)
# Cada careers_url se abrió el 07-oct; qué se vio en cada una: lanops/data/empresas-notas.md.
# enabled: false = la empresa no publica lista de ofertas (solo formulario de CV) o la URL no se pudo comprobar.
# Las que dependen de un ATS con JavaScript (TalentClue, SuccessFactors, Workday) se leen con Playwright (método por defecto).

title_filter:
  # Sin lista positiva = no se filtra por título (LANOPS es para cualquier perfil).
  # Añade aquí las palabras de tu puesto objetivo si quieres acotar, p. ej. "Ingeniero", "Técnico", "Investigador".
  positive: []
  negative: []

location_filter:
  # Solo ofertas en Gipuzkoa. Una oferta sin ubicación pasa (no se penaliza el dato que falta).
  allow:
    - "Gipuzkoa"
    - "Guipúzcoa"
    - "Guipuzcoa"
    - "San Sebastián"
    - "Donostia"
    - "Mondragón"
    - "Aduna"
    - "Aretxabaleta"
    - "Arrasate"
    - "Beasain"
    - "Elgoibar"
    - "Eskoriatza"
    - "Hernani"
    - "Irun"
    - "Ordizia"
    - "Ormaiztegi"

